name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.11.19'
      - run: uv sync --locked --python 3.12
      - run: uv run --locked pytest
      - run: uv run --locked rloop run examples/planted-signal
      - run: uv run --locked rloop report examples/planted-signal --check
      - run: uv run --locked rloop export examples/planted-signal
      - run: uv run --locked python scripts/check_example_report.py
