<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 476" width="1100" height="476" role="img" aria-labelledby="title desc">
  <title id="title">open-research-loops: one route, two roles</title>
  <desc id="desc">One route, two roles. Five stages: your question (step 1), a fair test (steps 2–3), plan and predict (steps 4–5), run once (steps 6–7), reflect (step 8). At each stage you decide: your question and what disproves it, what the score means and what counts as fair, your idea and choice and predicted number, the budget then your verdict before the agent interprets, and your method card in your own words. Your agent does the technical work: it checks licences, data and privacy first, makes the rule executable and prepares fair baselines, offers safe, unusual and no-GPU options, states cost first and tests before scoring the frozen candidate once with a protected evaluator, then asks short questions and drafts your method card. You leave with a checked result, a research brief and your own method card.</desc>
  <text x="20" y="28" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" letter-spacing="1.5" fill="#9198a1">ONE ROUTE, TWO ROLES</text>
  <text x="1080" y="28" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15" fill="#9198a1">you never need to code  ·  the verdict stays yours</text>
