[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "research-loops"
version = "0.1.0"
description = "Bounded research work with saved evidence and protected evaluation"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["pydantic==2.14.3", "typer==0.29.1"]

[project.optional-dependencies]
mcp = ["mcp==2.3.0"]
openai = ["openai-agents==0.24.0", "PyJWT[crypto]==2.15.1"]
claude = ["claude-agent-sdk==0.2.182"]
grain = ["scikit-image==0.26.0", "scipy==1.18.1", "numpy==2.5.4", "pillow==13.0.0", "imageio==2.38.1"]

[dependency-groups]
dev = ["pytest==9.2.0"]

[project.scripts]
rloop = "research_loops.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/research_loops"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "research_loops/skills"
"docs/DESIGN.md" = "research_loops/docs/DESIGN.md"
"docs/GUIDE.md" = "research_loops/docs/GUIDE.md"
"docs/LESSONS.md" = "research_loops/docs/LESSONS.md"
"LICENSE" = "research_loops/LICENSE"
"LICENSE-CC-BY-4.0" = "research_loops/LICENSE-CC-BY-4.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["container: actual Linux OCI isolation tests (explicit skip on Windows CI)"]

[tool.uv]
default-groups = ["dev"]
